spring.application.name=payment-simulator
server.port=${PORT:8083}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aegis_payment}
spring.datasource.username=${DB_USER:aegis_payment_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.user=${MIGRATION_USER}
spring.flyway.password=${MIGRATION_PASSWORD}
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
